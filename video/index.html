<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nehal & Himanshu – Wedding Invitation</title>
<meta property="og:title" content="Nehal & Himanshu – Wedding Invitation">
<meta property="og:image" content="poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--maroon:#7a1f3d;--gold:#c9a24b;--cream:#fff7ee}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;font-family:Georgia,'Times New Roman',serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #vid{width:100%;height:100%;object-fit:contain;background:#000}
  #bar{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.2);z-index:3;pointer-events:none}
  #bar i{display:block;height:100%;width:0;background:#c8a45c}
  #start{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font:16px system-ui,sans-serif;background:rgba(0,0,0,.35);cursor:pointer;text-align:center}
  #start .play{width:84px;height:84px;border-radius:50%;background:linear-gradient(180deg,#fff6ef,#e9c9cc);color:#6b2b3a;border:1px solid #c8a45c;box-shadow:inset 0 0 0 4px rgba(255,255,255,.55),0 6px 20px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:34px;padding-left:6px}
  #start.hide{display:none}
  .ctl{position:fixed;top:14px;right:14px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid #c8a45c;background:rgba(255,246,239,.85);color:#6b2b3a;font-size:19px;cursor:pointer;padding:0}
  #mute{right:14px}#rep{right:64px;display:none}
  /* menu button */
  :root{--ink:#6b2b3a;--rose:#e9c9cc;--rose2:#f6e3e1;--sage:#d5e2d1;--lav:#e3dcf0;--butter:#f7ecc9;--paper:#fffaf3;--gold:#c8a45c;--soft:#8a6a70}
  #fab{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);height:50px;padding:0 30px 0 24px;border-radius:25px;border:1px solid var(--gold);background:linear-gradient(180deg,#fff6ef,var(--rose));color:var(--ink);font:500 17px/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 20px rgba(107,43,58,.28),inset 0 0 0 3px rgba(255,255,255,.55);z-index:5;display:flex;align-items:center;gap:10px;white-space:nowrap;animation:pulse 2.6s infinite}
  #fab svg{width:18px;height:18px}
  #fab:active{transform:translateX(-50%) scale(.96)}
  @keyframes pulse{0%{box-shadow:0 6px 20px rgba(107,43,58,.28),inset 0 0 0 3px rgba(255,255,255,.55),0 0 0 0 rgba(200,164,92,.7)}70%,100%{box-shadow:0 6px 20px rgba(107,43,58,.28),inset 0 0 0 3px rgba(255,255,255,.55),0 0 0 16px rgba(200,164,92,0)}}

  #sheetBg{position:fixed;inset:0;background:rgba(58,30,38,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;z-index:6;align-items:flex-end;justify-content:center}
  #sheetBg.open{display:flex}
  body:has(#sheetBg.open) #fab{visibility:hidden}
  #sheet{position:relative;width:100%;min-width:0;max-width:480px;max-height:90%;overflow:auto;box-sizing:border-box;padding:30px 20px 30px;color:var(--ink);font:400 15px/1.5 'Jost',system-ui,sans-serif;user-select:text;
    background:radial-gradient(circle at 50% -10%,#fff 0,var(--paper) 45%,#fbeee6 100%);border-radius:34px 34px 0 0;border-top:1px solid var(--gold);animation:up .28s ease;scrollbar-width:none}
  #sheet::-webkit-scrollbar{display:none}
  #sheet::before{content:"";position:absolute;inset:7px 7px 0;border:1px solid rgba(200,164,92,.55);border-bottom:0;border-radius:28px 28px 0 0;pointer-events:none}
  @keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:var(--rose2);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;padding:0;z-index:2}
  .back{position:absolute;top:16px;left:16px;height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--gold);background:var(--rose2);color:var(--ink);font:500 13px 'Jost',sans-serif;letter-spacing:.06em;cursor:pointer;z-index:2}
  .ttl{text-align:center;margin:0;font:italic 500 32px/1.1 'Cormorant Garamond',Georgia,serif;color:var(--ink);padding-top:6px}
  .ttl small{display:block;font:400 11px 'Jost',sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--soft);margin-bottom:6px;font-style:normal}
  .orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 18px;color:var(--gold)}
  .orn::before,.orn::after{content:"";height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--gold))}
  .orn::after{transform:scaleX(-1)}
  .sub{text-align:center;font-size:13px;color:var(--soft);margin:-8px 0 16px;letter-spacing:.03em}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{position:relative;border:1px solid rgba(200,164,92,.7);border-radius:70px 70px 16px 16px;padding:22px 8px 16px;text-align:center;cursor:pointer;font:500 12.5px 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-decoration:none;display:block;box-shadow:0 4px 14px rgba(107,43,58,.1);transition:transform .15s}
  .tile:active{transform:scale(.97)}
  .tile svg{display:block;width:30px;height:30px;margin:0 auto 10px;stroke:var(--ink);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .t1{background:linear-gradient(180deg,#fbe9e6,#f3d3d4)}
  .t2{background:linear-gradient(180deg,#e9f1e5,#d1e0cd)}
  .t3{background:linear-gradient(180deg,#f1ecf8,#ddd3ee)}
  .t4{background:linear-gradient(180deg,#fcf4da,#f4e4b6)}
  .t5{grid-column:span 2;border-radius:16px 16px 16px 16px;background:linear-gradient(90deg,#f3d3d4,#e3dcf0);display:flex;align-items:center;justify-content:center;gap:12px;padding:16px}
  .t5 svg{margin:0}

  .btn{display:inline-block;border:1px solid var(--gold);background:linear-gradient(180deg,#fff3ee,var(--rose));color:var(--ink);padding:10px 20px;border-radius:22px;font:500 13px 'Jost',sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;margin:4px 3px;box-shadow:0 2px 8px rgba(107,43,58,.12)}
  .btn.alt{background:linear-gradient(180deg,#f4faf1,var(--sage))}
  .btn.sm{padding:7px 13px;font-size:11px;white-space:nowrap}
  .center{text-align:center}

  .day{display:flex;align-items:center;gap:10px;margin:14px 2px 8px;font:italic 500 21px 'Cormorant Garamond',Georgia,serif;color:var(--ink)}
  .day::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
  .ev{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid rgba(200,164,92,.45);border-left:5px solid var(--c,var(--rose));border-radius:14px;padding:11px 12px;margin-bottom:9px;box-shadow:0 2px 10px rgba(107,43,58,.07)}
  .ev .t{flex:1;min-width:0;line-height:1.35}
  .ev b{display:block;font:600 18px 'Cormorant Garamond',Georgia,serif;color:var(--ink)}
  .ev span{font-size:13px;color:var(--soft)}
  .ev a{color:var(--ink);font-size:12px;letter-spacing:.06em}

  .cd{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:6px 0 14px}
  .cd div{border:1px solid rgba(200,164,92,.7);border-radius:40px 40px 12px 12px;padding:14px 2px 10px;text-align:center}
  .cd div:nth-child(1){background:linear-gradient(180deg,#fbe9e6,#f3d3d4)}.cd div:nth-child(2){background:linear-gradient(180deg,#e9f1e5,#d1e0cd)}
  .cd div:nth-child(3){background:linear-gradient(180deg,#f1ecf8,#ddd3ee)}.cd div:nth-child(4){background:linear-gradient(180deg,#fcf4da,#f4e4b6)}
  .cd b{display:block;font:500 34px/1 'Cormorant Garamond',Georgia,serif;color:var(--ink)}
  .cd small{font:500 10px 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
  .note{text-align:center;font:italic 500 18px 'Cormorant Garamond',Georgia,serif;color:var(--soft)}

  .who{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;background:#fff;border:1px solid rgba(200,164,92,.5);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(107,43,58,.07)}
  .av{width:54px;height:54px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font:italic 500 26px 'Cormorant Garamond',Georgia,serif;color:var(--ink);border:1px solid var(--gold);background:linear-gradient(135deg,#fbe9e6,#e3dcf0)}
  .who .n{flex:1 1 140px;min-width:0;font:600 20px 'Cormorant Garamond',Georgia,serif}
  .who .n small{display:block;font:400 12px 'Jost',sans-serif;color:var(--soft);letter-spacing:.04em}

  #board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:6px 0 14px}
  .card{aspect-ratio:1;border-radius:14px;border:1px solid var(--gold);background:radial-gradient(circle at 50% 50%,#f6e3e1 0 28%,#e9c9cc 29% 31%,#f6e3e1 32%);color:var(--ink);font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 2px 8px rgba(107,43,58,.12)}
  .card.up{background:#fff}
  .card.done{background:var(--sage);border-color:#9db79a}
  .card .f{visibility:hidden}.card.up .f,.card.done .f{visibility:visible}
</style>
</head>
<body>
<div id="stage"><video id="vid" src="invite.mp4" poster="poster.jpg" playsinline preload="auto"></video></div>
<div id="bar"><i></i></div>
<div id="start"><div class="play">&#9654;</div><div><span style="font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:22px">Tap to open the invitation</span><br><small style="opacity:.8">(sound on 🔊)</small></div></div>
<button class="ctl" id="mute" aria-label="Mute">🔊</button>
<button class="ctl" id="rep" aria-label="Replay">↻</button>
<button id="fab" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Menu</button>

<div id="sheetBg"><div id="sheet"></div></div>

<script>
  /* ---------- video player ---------- */
  const v = document.getElementById('vid'), startEl = document.getElementById('start');
  const bar = document.querySelector('#bar i'), muteB = document.getElementById('mute'), repB = document.getElementById('rep');
  function play(){ v.muted = false; v.play().catch(() => { v.muted = true; v.play().catch(()=>{}); sync(); }); }
  function sync(){ muteB.textContent = v.muted ? '🔇' : '🔊'; }
  startEl.addEventListener('click', () => { startEl.classList.add('hide'); play(); sync(); });
  document.getElementById('stage').addEventListener('click', () => { v.paused ? play() : v.pause(); });
  muteB.addEventListener('click', () => { v.muted = !v.muted; sync(); });
  repB.addEventListener('click', () => { v.currentTime = 0; repB.style.display = 'none'; play(); });
  v.addEventListener('timeupdate', () => { bar.style.width = (v.currentTime / (v.duration || 1) * 100) + '%'; });
  v.addEventListener('ended', () => { repB.style.display = 'block'; });
  addEventListener('keydown', e => {
    if(e.key === 'Escape') return closeSheet();
    if(bg.classList.contains('open')) return;
    if(e.key === ' ') { e.preventDefault(); v.paused ? play() : v.pause(); }
  });

  /* ---------- menu ---------- */
  const bg = document.getElementById('sheetBg'), sheet = document.getElementById('sheet');
  const MAP = 'https://www.google.com/maps/search/?api=1&query=Jaypee+Greens+Golf+and+Spa+Resort+Greater+Noida';
  const VENUE = 'Jaypee Greens Golf & Spa Resort, Greater Noida';
  // [title, venue spot, card page, start (UTC), hours, label]
  const EVENTS = [
    ['Mehendi – Sunshine Carnival','Spa Garden',3,'20261120T063000Z',4,'Fri 20 Nov · 12:00 pm'],
    ['Tilak & Ring Ceremony','Royal Ballroom',4,'20261120T133000Z',2,'Fri 20 Nov · 7:00 pm'],
    ['The Musical Soirée','Royal Ballroom',4,'20261120T153000Z',3,'Fri 20 Nov · 9:00 pm'],
    ['Haldi – Tales of Joy','Spa Garden',5,'20261121T050000Z',3,'Sat 21 Nov · 10:30 am'],
    ['Wedding – Nehal & Himanshu','Royal Garden',6,'20261121T133000Z',4,'Sat 21 Nov · 7:00 pm'],
  ];
  const pad = n => String(n).padStart(2,'0');
  function addHours(s,h){
    const d = new Date(Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8),+s.slice(9,11),+s.slice(11,13)) + h*36e5);
    return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';
  }
  function ics(list){
    const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//NehalHimanshuWedding//EN'];
    list.forEach((e,k) => lines.push('BEGIN:VEVENT','UID:nh-'+k+'-'+e[3]+'@wedding','DTSTAMP:20261001T000000Z',
      'DTSTART:'+e[3],'DTEND:'+addHours(e[3],e[4]),'SUMMARY:'+e[0],'LOCATION:'+e[1]+'\\, '+VENUE.replace(/,/g,'\\,'),'END:VEVENT'));
    lines.push('END:VCALENDAR');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/calendar'}));
    a.download = list.length > 1 ? 'nehal-himanshu-wedding.ics' : 'event.ics';
    document.body.appendChild(a); a.click(); a.remove();
  }
  let timer = null;
  const head = (t,k,back) => (back ? '<button class="back" data-a="home">‹ Back</button>' : '') +
    '<button class="close" data-a="close" aria-label="Close">×</button><h2 class="ttl"><small>'+(back ? k : 'With love')+'</small>'+t+'</h2>';
  const views = {
    home: () => head('Nehal & Himanshu','20 – 21 November 2026') +
      '<div class="orn">❖</div><div class="grid">'+
      '<a class="tile t1" href="'+MAP+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>Venue Map</a>'+
      '<button class="tile t2" data-a="events"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Events</button>'+
      '<button class="tile t3" data-a="countdown"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3.2 2"/></svg>Countdown</button>'+
      '<button class="tile t4" data-a="rsvp"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3.5 7l8.5 6.2L20.5 7"/></svg>RSVP</button>'+
      '<button class="tile t5" data-a="game"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>Play a little game</button></div>',
    events: () => head('The Celebrations','Events',true) + '<div class="orn">❖</div><div class="sub">'+VENUE+'</div>'+
      [['Friday, 20 November',0,3],['Saturday, 21 November',3,5]].map(d => '<div class="day">'+d[0]+'</div>'+
        EVENTS.slice(d[1],d[2]).map((e,j) => { const k = d[1]+j; return '<div class="ev" style="--c:'+['#f3d3d4','#d1e0cd','#ddd3ee','#f4e4b6','#f3d3d4'][k]+'"><div class="t"><b>'+e[0]+'</b><span>'+e[5].split(' · ')[1]+' · '+e[1]+'</span>'+''+'</div>'+
          '<button class="btn sm" data-a="ics" data-k="'+k+'">+ Calendar</button></div>'; }).join('')).join('')+
      '<div class="center" style="margin-top:14px"><button class="btn" data-a="icsall">Add all events</button><a class="btn alt" href="'+MAP+'" target="_blank" rel="noopener">Open map</a></div>',
    countdown: () => head('Until We Celebrate','Countdown',true) + '<div class="orn">❖</div><div class="cd" id="cd"></div><div class="note">Saturday, 21 November 2026 · 7:00 pm<br>Royal Garden</div>',
    rsvp: () => head('Kindly Reply','RSVP',true) + '<div class="orn">❖</div><div class="sub">We would love to celebrate with you</div>'+
      [['Nitin Gupta','N','919910170370','+91 99101 70370'],['Reena Gupta','R','919811901370','+91 98119 01370']].map(p =>
        '<div class="who"><div class="av">'+p[1]+'</div><div class="n">'+p[0]+'<small>'+p[3]+'</small></div>'+
        '<a class="btn sm" href="tel:+'+p[2]+'">Call</a><a class="btn sm alt" href="https://wa.me/'+p[2]+'?text='+encodeURIComponent('Hello! RSVP for Nehal & Himanshu\'s wedding: ')+'" target="_blank" rel="noopener">WhatsApp</a></div>').join(''),
    game: () => head('Match the Pairs','A little game',true) + '<div class="orn">❖</div><div class="sub" id="moves">Moves: 0</div><div id="board"></div><div class="center"><button class="btn" data-a="game">Shuffle</button></div>',
  };
  function render(v){
    clearInterval(timer);
    sheet.innerHTML = views[v]();
    if(v === 'countdown') tick(), timer = setInterval(tick,1000);
    if(v === 'game') startGame();
  }
  function tick(){
    const el = document.getElementById('cd'); if(!el) return;
    let s = Math.floor((new Date('2026-11-21T19:00:00+05:30') - Date.now())/1000);
    if(s <= 0){ el.innerHTML = '<b style="color:#7a1f3d;font-size:20px">Today is the day! 🎉</b>'; return; }
    const d = Math.floor(s/86400); s %= 86400; const h = Math.floor(s/3600); s %= 3600;
    el.innerHTML = [[d,'days'],[h,'hours'],[Math.floor(s/60),'mins'],[s%60,'secs']].map(x => '<div><b>'+x[0]+'</b><small>'+x[1]+'</small></div>').join('');
  }
  function openSheet(){ bg.classList.add('open'); render('home'); }
  function closeSheet(){ bg.classList.remove('open'); clearInterval(timer); }
  document.getElementById('fab').addEventListener('click', openSheet);
  bg.addEventListener('click', e => {
    if(e.target === bg) return closeSheet();
    const t = e.target.closest('[data-a]'); if(!t) return;
    const a = t.dataset.a;
    if(a === 'close') closeSheet();
    else if(a === 'ics') ics([EVENTS[+t.dataset.k]]);
    else if(a === 'icsall') ics(EVENTS);
    else render(a);
  });

  /* ---------- memory game ---------- */
  function startGame(){
    const icons = ['💍','🛕','🌸','🪔','🎶','✨'];
    const deck = icons.concat(icons).map(v => ({v,r:Math.random()})).sort((a,b) => a.r-b.r).map(x => x.v);
    const board = document.getElementById('board'), mv = document.getElementById('moves');
    let first = null, lock = false, moves = 0, pairs = 0;
    board.innerHTML = deck.map((v,k) => '<button class="card" data-i="'+k+'"><span class="f">'+v+'</span></button>').join('');
    board.onclick = e => {
      const c = e.target.closest('.card');
      if(!c || lock || c === first || c.classList.contains('done')) return;
      c.classList.add('up');
      if(!first){ first = c; return; }
      mv.textContent = 'Moves: ' + (++moves);
      if(deck[+first.dataset.i] === deck[+c.dataset.i]){
        first.classList.replace('up','done'); c.classList.replace('up','done'); first = null;
        if(++pairs === icons.length) mv.textContent = '🎉 Matched all in ' + moves + ' moves!';
      } else {
        lock = true; const f = first; first = null;
        setTimeout(() => { f.classList.remove('up'); c.classList.remove('up'); lock = false; }, 700);
      }
    };
  }

</script>
</body>
</html>
